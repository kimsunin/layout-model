<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="1040" height="860" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>

<text x="520" y="34" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">GNN 층 1개 (Pre-LN · gate · 잔차)</text>

<!-- 입력 h -->
<rect x="400" y="56" width="240" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="79" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">h [N, d]</text>
<line x1="520" y1="92" x2="520" y2="128" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="520" cy="108" r="3.5" fill="#1f2937"/>

<!-- 블록 1 영역 -->
<rect x="320" y="118" width="400" height="320" rx="8" fill="#fafafa" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="160" y="262" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">블록 ① 어텐션</text>
<text x="160" y="284" font-size="13" fill="#1f2937" text-anchor="middle">노드 축</text>
<text x="160" y="302" font-size="12" fill="#6b7280" text-anchor="middle">그래프 이웃의 정보 받기</text>

<rect x="400" y="128" width="240" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="520" y="151" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">AdaLN (shift₁, scale₁)</text>
<line x1="520" y1="164" x2="520" y2="186" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="380" y="186" width="280" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="520" y="210" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">엣지 조건 어텐션 (헤드 4)</text>
<text x="520" y="232" font-size="12" fill="#6b7280" text-anchor="middle">Q, K, V = h·W_q, h·W_k, h·W_v</text>
<text x="520" y="252" font-size="12" fill="#6b7280" text-anchor="middle">점수 = QKᵀ / √d_h + e</text>
<text x="520" y="272" font-size="12" fill="#6b7280" text-anchor="middle">그래프에 없는 쌍 = −∞ (자기 자신은 항상 허용)</text>
<text x="520" y="292" font-size="12" fill="#6b7280" text-anchor="middle">α = softmax(점수): 행마다 합 1</text>
<text x="520" y="312" font-size="12" fill="#6b7280" text-anchor="middle">α·V → 출력 Linear = 이웃의 가중 평균</text>
<text x="520" y="328" font-size="11" fill="#6b7280" text-anchor="middle">[N, N] @ [N, d] → [N, d]</text>
<line x1="520" y1="336" x2="520" y2="358" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="400" y="358" width="240" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="520" y="380" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">× gate₁</text>
<line x1="520" y1="392" x2="520" y2="410" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="520" cy="424" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="520" y="430" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>

<!-- 잔차 1 -->
<polyline points="520,108 345,108 345,424 504,424" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="270" font-size="12" fill="#6b7280" font-weight="bold">잔차</text>

<!-- 그래프 입력 -->
<rect x="770" y="214" width="240" height="96" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="890" y="238" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">그래프</text>
<text x="890" y="260" font-size="12" fill="#6b7280" text-anchor="middle">edge_mask [N, N] → −∞ 마스크</text>
<text x="890" y="280" font-size="12" fill="#6b7280" text-anchor="middle">edge_attr [N, N, 16]</text>
<text x="890" y="298" font-size="12" fill="#6b7280" text-anchor="middle">→ Linear 16→4 (층마다) → e</text>
<line x1="770" y1="262" x2="662" y2="262" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aro)"/>

<!-- c 입력 표시 -->
<text x="660" y="151" font-size="12" fill="#ea580c">← c에서 (AdaLN 그림)</text>
<text x="660" y="380" font-size="12" fill="#ea580c">← c에서</text>

<line x1="520" y1="438" x2="520" y2="476" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="520" cy="456" r="3.5" fill="#1f2937"/>

<!-- 블록 2 영역 -->
<rect x="320" y="466" width="400" height="270" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="160" y="590" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">블록 ② FFN</text>
<text x="160" y="612" font-size="13" fill="#1f2937" text-anchor="middle">피처 축</text>
<text x="160" y="630" font-size="12" fill="#6b7280" text-anchor="middle">노드마다 따로 비선형 가공</text>

<rect x="400" y="476" width="240" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="520" y="499" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">AdaLN (shift₂, scale₂)</text>
<line x1="520" y1="512" x2="520" y2="534" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="380" y="534" width="280" height="96" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="558" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">FFN (2층)</text>
<text x="520" y="580" font-size="12" fill="#6b7280" text-anchor="middle">Linear d→4d · GELU · Dropout · Linear 4d→d</text>
<text x="520" y="600" font-size="12" fill="#6b7280" text-anchor="middle">4d = 실제로 넓히는 은닉층</text>
<text x="520" y="619" font-size="12" fill="#6b7280" text-anchor="middle">노드끼리 섞지 않음 (N축 그대로)</text>
<line x1="520" y1="630" x2="520" y2="652" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="400" y="652" width="240" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="520" y="674" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">× gate₂</text>
<text x="660" y="499" font-size="12" fill="#ea580c">← c에서</text>
<text x="660" y="674" font-size="12" fill="#ea580c">← c에서</text>
<line x1="520" y1="686" x2="520" y2="704" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="520" cy="718" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="520" y="724" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>

<!-- 잔차 2 -->
<polyline points="520,456 345,456 345,718 504,718" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="592" font-size="12" fill="#6b7280" font-weight="bold">잔차</text>

<!-- 출력 h -->
<line x1="520" y1="732" x2="520" y2="752" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="400" y="752" width="240" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="775" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">h [N, d]</text>

<!-- 설명 -->
<line x1="40" y1="806" x2="1000" y2="806" stroke="#e5e7eb" stroke-width="1"/>
<text x="520" y="828" font-size="13" fill="#6b7280" text-anchor="middle">블록은 h를 대체하지 않고 더한다(잔차). 어텐션은 가중 평균이라 잔차 없이 쌓으면 노드들이 닮아 간다(과평활화).</text>
<text x="520" y="850" font-size="13" fill="#6b7280" text-anchor="middle">gate는 0으로 초기화 → 학습 시작 시 층 = 항등 · 층 1개를 지날 때마다 정보가 엣지 1칸씩 퍼짐</text>
</svg>
