<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="1040" height="720" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>

<text x="520" y="34" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">AdaLN: t에 따라 바뀌는 LayerNorm (adaLN-Zero)</text>

<!-- 왼쪽: 조건 경로 -->
<text x="200" y="66" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold">조건 경로 (t → 조절값)</text>
<rect x="60" y="80" width="280" height="46" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="200" y="100" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">t [B]</text>
<text x="200" y="117" font-size="12" fill="#6b7280" text-anchor="middle">노이즈 단계</text>
<line x1="200" y1="126" x2="200" y2="150" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="60" y="150" width="280" height="46" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="200" y="170" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">사인파 임베딩</text>
<text x="200" y="187" font-size="12" fill="#6b7280" text-anchor="middle">[B, 16]</text>
<line x1="200" y1="196" x2="200" y2="220" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="60" y="220" width="280" height="46" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="200" y="240" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">t MLP</text>
<text x="200" y="257" font-size="12" fill="#6b7280" text-anchor="middle">Linear 16→d · SiLU · Linear d→d</text>
<line x1="200" y1="266" x2="200" y2="290" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="60" y="290" width="280" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="200" y="310" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">c [B, d]</text>
<text x="200" y="327" font-size="12" fill="#6b7280" text-anchor="middle">모델에서 한 번 계산, 모든 층이 공유</text>
<line x1="200" y1="336" x2="200" y2="366" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="210" y="356" font-size="12" fill="#6b7280">층마다</text>
<rect x="60" y="366" width="280" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="200" y="389" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">SiLU → Linear (d → 6d)</text>
<text x="200" y="408" font-size="12" fill="#6b7280" text-anchor="middle">층마다 따로 · 가중치·편향 0으로 초기화</text>
<line x1="200" y1="422" x2="200" y2="446" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<text x="60" y="462" font-size="12" fill="#6b7280">어텐션 블록용</text>
<rect x="60" y="470" width="88" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="104" y="490" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">shift₁</text>
<rect x="156" y="470" width="88" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="200" y="490" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">scale₁</text>
<rect x="252" y="470" width="88" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="296" y="490" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">gate₁</text>
<text x="60" y="524" font-size="12" fill="#6b7280">FFN 블록용</text>
<rect x="60" y="532" width="88" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="104" y="552" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">shift₂</text>
<rect x="156" y="532" width="88" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="200" y="552" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">scale₂</text>
<rect x="252" y="532" width="88" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="296" y="552" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">gate₂</text>
<text x="200" y="584" font-size="12" fill="#6b7280" text-anchor="middle">각 [B, d]</text>

<!-- 조절값 버스 -->
<line x1="340" y1="516" x2="420" y2="516" stroke="#ea580c" stroke-width="1.6"/>
<line x1="420" y1="235" x2="420" y2="516" stroke="#ea580c" stroke-width="1.6"/>
<line x1="420" y1="235" x2="618" y2="235" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aro)"/>
<text x="520" y="228" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">scale</text>
<line x1="420" y1="300" x2="618" y2="300" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aro)"/>
<text x="520" y="293" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">shift</text>
<line x1="420" y1="446" x2="618" y2="446" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aro)"/>
<text x="520" y="439" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">gate</text>

<!-- 오른쪽: 블록 하나 -->
<text x="720" y="66" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold">GNN 층 안의 블록 하나 (어텐션 또는 FFN)</text>
<rect x="620" y="80" width="200" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="720" y="105" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">h [B, N, d]</text>
<line x1="720" y1="120" x2="720" y2="140" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="620" y="140" width="200" height="50" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="720" y="161" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">LayerNorm</text>
<text x="720" y="179" font-size="12" fill="#6b7280" text-anchor="middle">노드마다 평균 0·분산 1 (γ, β 없음)</text>
<line x1="720" y1="190" x2="720" y2="215" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="620" y="215" width="200" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="720" y="240" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">× (1 + scale)</text>
<line x1="720" y1="255" x2="720" y2="280" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="620" y="280" width="200" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="720" y="305" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">+ shift</text>
<line x1="720" y1="320" x2="720" y2="345" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="620" y="345" width="200" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="720" y="368" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">어텐션 또는 FFN</text>
<text x="720" y="387" font-size="12" fill="#6b7280" text-anchor="middle">1번 묶음 → 어텐션, 2번 → FFN</text>
<line x1="720" y1="401" x2="720" y2="426" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="620" y="426" width="200" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="720" y="451" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">× gate</text>
<line x1="720" y1="466" x2="720" y2="496" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="720" cy="512" r="16" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="720" y="518" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>
<line x1="720" y1="528" x2="720" y2="556" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="620" y="556" width="200" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="720" y="581" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">h [B, N, d]</text>

<!-- 잔차 -->
<polyline points="820,100 940,100 940,512 738,512" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="950" y="310" font-size="13" fill="#6b7280" font-weight="bold">잔차</text>

<!-- 설명 -->
<line x1="60" y1="620" x2="980" y2="620" stroke="#e5e7eb" stroke-width="1"/>
<text x="60" y="646" font-size="13" fill="#1f2937">• 일반 LayerNorm의 고정 γ, β 대신 t에서 만든 scale·shift를 쓴다. 학습 파라미터는 h가 아니라 c를 본다.</text>
<text x="60" y="672" font-size="13" fill="#1f2937">• scale·shift·gate는 [B, d]: 한 페이지의 모든 노드에 같은 값 (t는 페이지 단위). 차원마다 따로 곱하고 더한다.</text>
<text x="60" y="698" font-size="13" fill="#1f2937">• 초기화 0 → ×(1+0), +0, ×0 → h = h + 0 (항등). 학습하며 필요한 층부터 gate가 열린다.</text>
</svg>
