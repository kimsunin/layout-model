<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="30" y="40" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">학습: 샘플마다 순전파 1번</text>
<rect x="30" y="62" width="140" height="62" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="100.0" y="90.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">정답 x₀</text>
<text x="100.0" y="108.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">DocLayNet 레이아웃</text>
<rect x="192" y="62" width="140" height="62" rx="8" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.5"/>
<text x="262.0" y="90.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">노이즈 섞기</text>
<text x="262.0" y="108.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">t 무작위 → x_t</text>
<line x1="170" y1="93.0" x2="190" y2="93.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="354" y="62" width="140" height="62" rx="8" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="424.0" y="90.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">그래프 구성</text>
<text x="424.0" y="108.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">t=T 완전 / t&lt;T x_t 기준</text>
<line x1="332" y1="93.0" x2="352" y2="93.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="516" y="62" width="140" height="62" rx="8" fill="#dbeafe" stroke="#d1d5db" stroke-width="1.5"/>
<text x="586.0" y="90.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">GNN(x_t, t)</text>
<text x="586.0" y="108.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">가중치 하나 공유</text>
<line x1="494" y1="93.0" x2="514" y2="93.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="678" y="62" width="140" height="62" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="748.0" y="90.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">예측 x̂₀</text>
<text x="748.0" y="108.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">[N, 4] 좌표</text>
<line x1="656" y1="93.0" x2="676" y2="93.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="840" y="62" width="140" height="62" rx="8" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.5"/>
<text x="910.0" y="90.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">손실 → 역전파</text>
<text x="910.0" y="108.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">L(x̂₀, x₀)</text>
<line x1="818" y1="93.0" x2="838" y2="93.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M100.0,124 L100.0,150 L910.0,150 L910.0,126" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="500" y="168" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">정답과 비교 (생성에서 거치는 T단계를 펼치지 않음)</text>
<text x="30" y="233" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">생성: 같은 GNN을 T번 반복, 역전파 없음</text>
<rect x="30" y="255" width="140" height="62" rx="8" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.5"/>
<text x="100.0" y="283.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">무작위 좌표 x_T</text>
<text x="100.0" y="301.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">타입·개수만 고정</text>
<rect x="192" y="255" width="140" height="62" rx="8" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="262.0" y="283.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">그래프 구성</text>
<text x="262.0" y="301.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">t=T 완전 / t&lt;T x_t 기준</text>
<line x1="170" y1="286.0" x2="190" y2="286.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="354" y="255" width="140" height="62" rx="8" fill="#dbeafe" stroke="#d1d5db" stroke-width="1.5"/>
<text x="424.0" y="283.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">GNN(x_t, t)</text>
<text x="424.0" y="301.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">학습된 가중치 고정</text>
<line x1="332" y1="286.0" x2="352" y2="286.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="516" y="255" width="140" height="62" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="586.0" y="283.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">예측 x̂₀</text>
<text x="586.0" y="301.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">흐릿한 정답 추정</text>
<line x1="494" y1="286.0" x2="514" y2="286.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="678" y="255" width="140" height="62" rx="8" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.5"/>
<text x="748.0" y="283.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">DDIM 이동</text>
<text x="748.0" y="301.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">x_t → x_t-1 (조금만)</text>
<line x1="656" y1="286.0" x2="676" y2="286.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="840" y="255" width="140" height="62" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="910.0" y="283.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">최종 레이아웃</text>
<text x="910.0" y="301.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">t = 0 도달</text>
<line x1="818" y1="286.0" x2="838" y2="286.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="829.0" y="278.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">t=1 후</text>
<path d="M748.0,317 L748.0,357 L262.0,357 L262.0,319" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="505.0" y="377" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="normal">t ← t − 1 로 반복 · t &lt; T에서는 현재 좌표 x_t 기준 가시성 + 계층 그래프</text>
<text x="500" y="450" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">학습은 '임의의 t에서 x̂₀ 맞히기'를 배우고, 생성은 그 문제를 t = T → 1 순서로 이어 푼다</text>
</svg>
