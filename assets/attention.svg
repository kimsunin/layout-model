<text x="520" y="703" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">[N, d] → × gate₁ → 잔차</text>

<!-- 설명 -->
<line x1="40" y1="738" x2="1000" y2="738" stroke="#e5e7eb" stroke-width="1"/>
<text x="520" y="762" font-size="13" fill="#6b7280" text-anchor="middle">그래프는 연결 여부(0/1)만 정하고, 연결된 이웃을 얼마나 볼지(α)는 노드 상태(Q·K)와 엣지 속성(e)으로 매번 계산한다.</text>
<text x="520" y="786" font-size="13" fill="#6b7280" text-anchor="middle">연결 구조는 4개 헤드가 같고 가중치 α_h만 다르다 → 헤드마다 가중 그래프 행렬이 하나씩 있는 셈 (같은 관계를 4가지 기준으로 평가).</text>
<text x="520" y="810" font-size="13" fill="#6b7280" text-anchor="middle">같은 행렬을 4조각에 곱하면 나누는 의미가 없다. 헤드별 기준은 학습으로 정해지며 미리 지정하지 않는다.</text>
</svg>
