<text x="520" y="200" font-size="12" fill="#6b7280" text-anchor="middle">노드가 아니라 d를 4조각으로 나눔 (d = 128 → 32 × 4) · 헤드 h는 Q·K·V의 h번 조각만 사용</text>

<!-- 그래프 입력 -->
<rect x="70" y="216" width="430" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="285" y="236" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">edge_attr [N, N, 16] → Linear(16 → 4)</text>
<text x="285" y="253" font-size="12" fill="#6b7280" text-anchor="middle">헤드마다 다른 엣지 편향 e₁ · e₂ · e₃ · e₄ (층마다 따로)</text>
<rect x="540" y="216" width="430" height="46" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="755" y="236" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">edge_mask [N, N] + 자기 자신(대각선)</text>
<text x="755" y="253" font-size="12" fill="#6b7280" text-anchor="middle">4개 헤드가 같은 그래프를 공유</text>

