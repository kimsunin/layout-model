<text x="520" y="34" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">엣지 조건 어텐션 (헤드 4)</text>

<!-- 입력 -->
<rect x="400" y="54" width="240" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="77" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">h [N, d] (AdaLN 출력)</text>
<line x1="520" y1="90" x2="520" y2="102" stroke="#1f2937" stroke-width="1.6"/>
<polyline points="290,110 290,102 750,102 750,110" fill="none" stroke="#1f2937" stroke-width="1.6"/>
