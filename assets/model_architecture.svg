<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="1040" height="740" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>

<text x="520" y="34" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">전체 구조 (encode – process – decode)</text>

<!-- 입력 -->
<rect x="360" y="56" width="320" height="50" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="77" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">입력</text>
<text x="520" y="95" font-size="12" fill="#6b7280" text-anchor="middle">types [N] · x_t [N, 4] · t · node_mask [N]</text>
<line x1="520" y1="106" x2="520" y2="130" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- 피처 -->
<rect x="360" y="130" width="320" height="86" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="152" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">노드 피처 [N, 39]</text>
<text x="520" y="170" font-size="12" fill="#6b7280" text-anchor="middle">타입 one-hot 9 · 페이지 내 타입별 개수 9 · 총 요소 수 1</text>
<text x="520" y="187" font-size="12" fill="#6b7280" text-anchor="middle">x_t 4 · t 임베딩 16</text>
<text x="520" y="205" font-size="12" fill="#6b7280" text-anchor="middle">이어 붙이기만 함 (학습 파라미터 없음)</text>
<line x1="520" y1="216" x2="520" y2="240" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- 인코더 -->
<rect x="360" y="240" width="320" height="56" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="263" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">인코더 MLP (2층)</text>
<text x="520" y="282" font-size="12" fill="#6b7280" text-anchor="middle">Linear 39→d · GELU · Linear d→d</text>
<line x1="520" y1="296" x2="520" y2="320" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- GNN 층 -->
<rect x="360" y="320" width="320" height="116" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="520" y="352" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">GNN 층</text>
<text x="520" y="374" font-size="12" fill="#6b7280" text-anchor="middle">AdaLN · 엣지 조건 어텐션 · AdaLN · FFN</text>
<text x="520" y="392" font-size="12" fill="#6b7280" text-anchor="middle">h [N, d] → h [N, d]</text>
<text x="520" y="412" font-size="12" fill="#2563eb" text-anchor="middle">자세히: GNN 층 1개 그림</text>
<text x="668" y="428" font-size="16" fill="#2563eb" text-anchor="end" font-weight="bold">× L</text>
<line x1="520" y1="436" x2="520" y2="460" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- LayerNorm -->
<rect x="360" y="460" width="320" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="485" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">LayerNorm</text>
<line x1="520" y1="500" x2="520" y2="524" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- 디코더 -->
<rect x="360" y="524" width="320" height="56" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="520" y="547" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">디코더 MLP (2층)</text>
<text x="520" y="566" font-size="12" fill="#6b7280" text-anchor="middle">Linear d→d · GELU · Linear d→4 (활성화 없음)</text>
<line x1="520" y1="580" x2="520" y2="604" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- 출력 -->
<rect x="360" y="604" width="320" height="54" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="520" y="627" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">출력 x̂₀ [N, 4]</text>
<text x="520" y="645" font-size="12" fill="#6b7280" text-anchor="middle">[−1, 1] (cx, cy, w, h) · 모든 노드 동시 예측</text>

<!-- t 조건 -->
<rect x="40" y="320" width="270" height="116" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="175" y="345" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">t 조건</text>
<text x="175" y="366" font-size="12" fill="#6b7280" text-anchor="middle">t → 사인파 [16] (피처와 같은 함수)</text>
<text x="175" y="384" font-size="12" fill="#6b7280" text-anchor="middle">→ t MLP 16→d→d → c [d]</text>
<text x="175" y="402" font-size="12" fill="#6b7280" text-anchor="middle">한 번 계산해 모든 층이 공유</text>
<text x="175" y="420" font-size="12" fill="#ea580c" text-anchor="middle">→ 층마다 AdaLN (AdaLN 그림)</text>
<line x1="310" y1="378" x2="358" y2="378" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aro)"/>

<!-- 그래프 -->
<rect x="730" y="320" width="270" height="116" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="865" y="345" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">그래프 (모델 밖에서 구성)</text>
<text x="865" y="366" font-size="12" fill="#6b7280" text-anchor="middle">edge_mask [N, N]</text>
<text x="865" y="384" font-size="12" fill="#6b7280" text-anchor="middle">edge_attr [N, N, 16] (15 + 종류)</text>
<text x="865" y="402" font-size="12" fill="#6b7280" text-anchor="middle">t = T: 완전 그래프</text>
<text x="865" y="420" font-size="12" fill="#6b7280" text-anchor="middle">t &lt; T: x_t 기준 가시성 + 계층</text>
<line x1="730" y1="378" x2="682" y2="378" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aro)"/>

<!-- 설명 -->
<line x1="40" y1="682" x2="1000" y2="682" stroke="#e5e7eb" stroke-width="1"/>
<text x="520" y="706" font-size="13" fill="#6b7280" text-anchor="middle">노드 표현은 인코더부터 디코더까지 [N, d] · 가중치 1세트를 모든 t가 공유 · 학습 시 앞에 배치 축 B가 붙음</text>
<text x="520" y="728" font-size="13" fill="#6b7280" text-anchor="middle">완전 그래프 + 엣지 속성 0 = Transformer (비교군) · d ∈ {128, 256} · L ∈ {6, 8, 10} · FFN 4d · 헤드 4 · 드롭아웃 0.1</text>
</svg>
